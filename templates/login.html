{% extends "base.html" %}

{% block title %}Login - Customer Segmentation{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-light mb-2">
                    <i class="bi bi-person-lock fs-1 text-info"></i>
                </div>
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Sign in to experience real-time behavioral segmentation</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none text-info">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
                    <label class="form-check-label small" for="remember">Keep me logged in</label>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                </button>
            </form>

            <div class="text-center mt-2">
                <span class="text-muted small">Don't have an account? </span>
                <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-info text-decoration-none">Register here</a>
            </div>

            <!-- Admin Account Quick Fill Helper -->
            <div class="mt-4 pt-3 border-top">
                <p class="text-muted small fw-bold mb-2 text-center text-uppercase">Admin Quick Access</p>
                <div class="d-flex flex-wrap gap-2 justify-content-center">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('pavitrakasarapu@gmail.com', 'Admin@123')">
                        <i class="bi bi-shield-lock-fill text-warning"></i> Administrator Portal
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
