{% extends "base.html" %}

{% block title %}Reset Password - Customer Segmentation{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-light mb-2">
                    <i class="bi bi-key-fill fs-1 text-info"></i>
                </div>
                <h3 class="fw-bold text-dark">Verify OTP & Reset</h3>
                <p class="text-muted small">Enter the 6-digit OTP code to establish your new password</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required readonly>
                </div>

                <div class="mb-3">
                    <label for="otp_code" class="form-label fw-semibold">6-Digit OTP Code</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                        <input type="text" class="form-control text-center fs-5 fw-bold letter-spacing-2" id="otp_code" name="otp_code" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autofocus>
                    </div>
                    <div class="form-text">Expires after 5 minutes. Limited attempts allowed.</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 chars" required minlength="6">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                    <i class="bi bi-check2-circle me-2"></i> Reset Password
                </button>
            </form>

            <div class="text-center mt-2">
                <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted me-3">Resend OTP</a>
                <a href="{{ url_for('auth.login') }}" class="small text-muted">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
