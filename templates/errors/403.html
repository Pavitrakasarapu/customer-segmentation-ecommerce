{% extends "base.html" %}

{% block title %}Access Denied (403) - Customer Segmentation{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <i class="bi bi-shield-x fs-1 text-danger mb-3 d-block"></i>
            <h2 class="fw-bold text-dark">403 - Access Forbidden</h2>
            <p class="text-muted mb-4">
                You do not have permission to view this resource. Normal customer accounts cannot access administrative areas.
            </p>
            <div>
                <a href="{{ url_for('shop.index') }}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Return to Shopping
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
