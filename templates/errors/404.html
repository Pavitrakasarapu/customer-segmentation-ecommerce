{% extends "base.html" %}

{% block title %}Page Not Found (404) - Customer Segmentation{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <i class="bi bi-question-circle fs-1 text-info mb-3 d-block"></i>
            <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
            <p class="text-muted mb-4">
                The page or product you requested could not be located. It may have been moved or removed.
            </p>
            <div>
                <a href="{{ url_for('shop.index') }}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-house me-1"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
