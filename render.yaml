services:
  - type: web
    name: customer-segmentation-ecommerce
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: customer-segmentation-db
          property: connectionString
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: pavitrakasarapu@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"

databases:
  - name: customer-segmentation-db
    plan: free
    region: oregon
    databaseName: customer_segmentation
    user: cs_user
